
<h2 class="sr-only">App de revista de inventario — Grupo Medios Audiovisuales COEST</h2>

<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: var(--font-sans); }

#app { padding: 0; min-height: 600px; }

.top-bar {
  background: #0a0a0a;
  color: #fff;
  padding: 14px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-radius: var(--border-radius-lg) var(--border-radius-lg) 0 0;
}
.top-bar-left { display: flex; align-items: center; gap: 10px; }
.rec-dot { width: 10px; height: 10px; border-radius: 50%; background: #e74c3c; animation: pulse 1.5s infinite; }
@keyframes pulse { 0%,100%{ opacity:1 } 50%{ opacity:0.4 } }
.top-bar h1 { font-size: 14px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: #fff; }
.top-bar-subtitle { font-size: 11px; color: rgba(255,255,255,0.5); margin-top: 1px; }
.stats-bar { display: flex; gap: 6px; }
.stat-pill { background: rgba(255,255,255,0.08); border: 0.5px solid rgba(255,255,255,0.15); border-radius: 20px; padding: 4px 10px; font-size: 11px; font-weight: 500; color: rgba(255,255,255,0.8); }
.stat-pill span { color: #fff; font-weight: 600; }

.controls {
  background: var(--color-background-secondary);
  border-bottom: 0.5px solid var(--color-border-tertiary);
  padding: 10px 16px;
  display: flex;
  gap: 10px;
  align-items: center;
  flex-wrap: wrap;
}
.search-wrap { position: relative; flex: 1; min-width: 160px; }
.search-wrap i { position: absolute; left: 9px; top: 50%; transform: translateY(-50%); color: var(--color-text-secondary); font-size: 15px; pointer-events: none; }
#search { width: 100%; padding: 7px 10px 7px 30px; font-size: 13px; border: 0.5px solid var(--color-border-secondary); border-radius: var(--border-radius-md); background: var(--color-background-primary); color: var(--color-text-primary); }
select { padding: 7px 10px; font-size: 13px; border: 0.5px solid var(--color-border-secondary); border-radius: var(--border-radius-md); background: var(--color-background-primary); color: var(--color-text-primary); cursor: pointer; }
.filter-btns { display: flex; gap: 4px; }
.fbtn { padding: 6px 10px; font-size: 12px; border: 0.5px solid var(--color-border-secondary); border-radius: var(--border-radius-md); background: var(--color-background-primary); color: var(--color-text-secondary); cursor: pointer; transition: all 0.15s; }
.fbtn.active, .fbtn:hover { background: #0a0a0a; color: #fff; border-color: #0a0a0a; }
.export-btn { padding: 7px 14px; font-size: 12px; font-weight: 500; background: #e74c3c; color: #fff; border: none; border-radius: var(--border-radius-md); cursor: pointer; display: flex; align-items: center; gap: 5px; }
.export-btn:hover { background: #c0392b; }

.list-area { padding: 12px 16px; display: flex; flex-direction: column; gap: 6px; max-height: 460px; overflow-y: auto; }

.item-card {
  background: var(--color-background-primary);
  border: 0.5px solid var(--color-border-tertiary);
  border-radius: var(--border-radius-md);
  padding: 10px 12px;
  display: grid;
  grid-template-columns: 48px 1fr auto auto;
  gap: 10px;
  align-items: center;
  transition: border-color 0.15s;
}
.item-card:hover { border-color: var(--color-border-secondary); }
.item-card.presente { border-left: 3px solid #27ae60; }
.item-card.ausente { border-left: 3px solid #e74c3c; }
.item-card.pendiente { border-left: 3px solid #f39c12; }

.item-thumb {
  width: 48px; height: 48px; border-radius: 6px;
  background: var(--color-background-secondary);
  border: 0.5px solid var(--color-border-tertiary);
  display: flex; align-items: center; justify-content: center;
  overflow: hidden; cursor: pointer; position: relative;
  font-size: 20px; color: var(--color-text-secondary);
}
.item-thumb img { width: 100%; height: 100%; object-fit: cover; border-radius: 6px; }
.item-thumb .cam-ico { font-size: 10px; color: var(--color-text-secondary); position: absolute; bottom: 2px; right: 3px; }

.item-info { min-width: 0; }
.item-clase { font-size: 10px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.06em; color: var(--color-text-secondary); margin-bottom: 2px; }
.item-nombre { font-size: 13px; font-weight: 500; color: var(--color-text-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item-serie { font-size: 11px; color: var(--color-text-secondary); font-family: var(--font-mono); margin-top: 1px; }

.item-comment-wrap { width: 160px; }
.item-comment-wrap textarea {
  width: 100%; font-size: 11px; resize: none; height: 44px;
  border: 0.5px solid var(--color-border-tertiary);
  border-radius: 6px; padding: 4px 7px;
  background: var(--color-background-secondary);
  color: var(--color-text-primary);
  font-family: var(--font-sans);
  line-height: 1.4;
}
.item-comment-wrap textarea:focus { outline: none; border-color: var(--color-border-primary); }

.check-btns { display: flex; flex-direction: column; gap: 4px; }
.chk { padding: 5px 8px; font-size: 11px; font-weight: 500; border-radius: 5px; border: 0.5px solid; cursor: pointer; background: var(--color-background-secondary); transition: all 0.12s; white-space: nowrap; }
.chk-si { border-color: #27ae60; color: #27ae60; }
.chk-si.active { background: #27ae60; color: #fff; }
.chk-no { border-color: #e74c3c; color: #e74c3c; }
.chk-no.active { background: #e74c3c; color: #fff; }
.chk-na { border-color: #f39c12; color: #f39c12; }
.chk-na.active { background: #f39c12; color: #fff; }

.empty { text-align: center; padding: 40px; color: var(--color-text-secondary); font-size: 13px; }

.modal-bg {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,0.6); z-index: 100;
  align-items: center; justify-content: center;
}
.modal-bg.open { display: flex; }
.modal {
  background: var(--color-background-primary);
  border-radius: var(--border-radius-lg);
  border: 0.5px solid var(--color-border-secondary);
  padding: 20px;
  width: 320px;
  max-width: 95vw;
}
.modal h3 { font-size: 14px; font-weight: 500; margin-bottom: 12px; }
.modal-preview { width: 100%; height: 180px; object-fit: cover; border-radius: 8px; border: 0.5px solid var(--color-border-tertiary); background: var(--color-background-secondary); display: flex; align-items: center; justify-content: center; overflow: hidden; margin-bottom: 12px; font-size: 13px; color: var(--color-text-secondary); }
.modal-preview img { width: 100%; height: 100%; object-fit: cover; }
.modal-btns { display: flex; gap: 8px; }
.modal-btns button { flex: 1; padding: 8px; font-size: 13px; border-radius: var(--border-radius-md); border: 0.5px solid var(--color-border-secondary); cursor: pointer; background: var(--color-background-secondary); color: var(--color-text-primary); }
.modal-btns .primary { background: #0a0a0a; color: #fff; border-color: #0a0a0a; }
#file-input { display: none; }

.pdf-notice {
  background: #0a0a0a; color: #fff;
  padding: 10px 16px; font-size: 12px;
  border-radius: 0 0 var(--border-radius-lg) var(--border-radius-lg);
  display: flex; align-items: center; justify-content: space-between;
}

.progress-bar-wrap { height: 4px; background: rgba(255,255,255,0.1); border-radius: 2px; flex: 1; margin: 0 12px; }
.progress-bar { height: 100%; background: #27ae60; border-radius: 2px; transition: width 0.3s; }
</style>

<div id="app">
  <div class="top-bar">
    <div class="top-bar-left">
      <div class="rec-dot"></div>
      <div>
        <div class="top-bar h1" style="font-size:13px;font-weight:500;letter-spacing:0.08em;text-transform:uppercase;">Grupo Medios Audiovisuales · COEST</div>
        <div class="top-bar-subtitle">Revista de Inventario — <span id="fecha-rev"></span></div>
      </div>
    </div>
    <div class="stats-bar">

      <div class="stat-pill" style="color:#f39c12">⚠ <span id="s-pend">0</span></div>

  <div class="controls">
    <div class="search-wrap">
      <i class="ti ti-search" aria-hidden="true"></i>
      <input id="search" type="text" placeholder="Buscar por nombre, serie, marca…">
    </div>
    <select id="cat-filter">

    <div class="filter-btns">

  </div>

  <div class="list-area" id="list-area"></div>

  <div class="pdf-notice">
    <span style="color:rgba(255,255,255,0.6)">Progreso de revista</span>
    <div class="progress-bar-wrap">
      <div class="progress-bar" id="prog-bar" style="width:0%"></div>
    </div>
    <span id="prog-text" style="font-weight:500">0 / 0 revisados</span>
  </div>
</div>

<div class="modal-bg" id="photo-modal">

    <input type="file" id="file-input" accept="image/*">
    <div class="modal-btns">
      <button onclick="closeModal()">Cancelar</button>
      <button class="primary" onclick="document.getElementById('file-input').click()"><i class="ti ti-camera" aria-hidden="true"></i> Seleccionar foto</button>
    </div>
  </div>
</div>

const ICONS = {
  'AUDIFONOS': 'ti-headphones','CAMARA DE VIDEO': 'ti-video','CAMARA DIGITAL': 'ti-camera','CAMARA FOTOGRAFICA': 'ti-camera','COMPUTADOR': 'ti-device-desktop','COMPUTADOR PORTATIL': 'ti-device-laptop','CONSOLA DE SONIDO': 'ti-adjustments','DISCO DURO EXTERNO': 'ti-device-usb','DVD': 'ti-disc','EQUIPO DE GRABACION': 'ti-microphone','ESTABILIZADOR  PORTATIL': 'ti-rotate','EXTENSOR DE AUDIO': 'ti-plug','GRABADORA DE VIDEO': 'ti-device-tv','IMPRESORA': 'ti-printer','INTERFAZ DE COMUNICACION': 'ti-network','KIT DE MICROFONOS': 'ti-microphone','LENTE FOTOGRAFICO': 'ti-zoom-in','LIBRERIA DE BACKUP': 'ti-database','LICENCIA': 'ti-certificate','LICENCIA OFFICE': 'ti-certificate','MEZCLADORA DE AUDIO': 'ti-adjustments','MICROFONO': 'ti-microphone','MICROFONO INALAMBRICO': 'ti-broadcast','MONITOR DE AUDIO': 'ti-volume','PANTALLA LED': 'ti-device-tv','PARLANTE': 'ti-volume','PROCESADOR DE VIDEO': 'ti-cpu','RADIO GRABADORA': 'ti-radio','REFLECTOR': 'ti-bulb','SCANNER': 'ti-scan','SERVIDOR': 'ti-server','SWITCH': 'ti-router','TABLET': 'ti-device-tablet','TABLETA GRAFICA': 'ti-device-tablet','TELEFONO IP': 'ti-phone','TELEPRONTER': 'ti-presentation','TELEVISOR': 'ti-device-tv','TRIPODE': 'ti-camera','UPS': 'ti-battery','WORKSTATION': 'ti-device-desktop'
};

let state = {};
ITEMS.forEach(it => { state[it.id] = { check: null, comment: '', photo: null }; });

let activeFilter = 'all';
let catFilter = '';
let searchQ = '';
let modalItemId = null;

function getIcon(clase) { return ICONS[clase] || 'ti-device-floppy'; }

function updateStats() {
  let pres=0, aus=0, pend=0;
  ITEMS.forEach(it => {
    const s = state[it.id];
    if (s.check === 'presente') pres++;
    else if (s.check === 'ausente') aus++;
    else pend++;
  });
  document.getElementById('s-total').textContent = ITEMS.length;
  document.getElementById('s-pres').textContent = pres;
  document.getElementById('s-aus').textContent = aus;
  document.getElementById('s-pend').textContent = pend;
  const rev = pres + aus;
  document.getElementById('prog-text').textContent = rev + ' / ' + ITEMS.length + ' revisados';
  document.getElementById('prog-bar').style.width = Math.round(rev/ITEMS.length*100) + '%';
}

function getFiltered() {
  return ITEMS.filter(it => {
    const s = state[it.id];
    if (activeFilter === 'presente' && s.check !== 'presente') return false;
    if (activeFilter === 'ausente' && s.check !== 'ausente') return false;
    if (activeFilter === 'pendiente' && s.check !== null) return false;
    if (catFilter && it.clase !== catFilter) return false;
    if (searchQ) {
      const q = searchQ.toLowerCase();
      if (!(it.clase.toLowerCase().includes(q) || it.marca.toLowerCase().includes(q) || it.modelo.toLowerCase().includes(q) || it.serie.toLowerCase().includes(q) || it.nroInventario.toLowerCase().includes(q) || it.funcionario.toLowerCase().includes(q))) return false;
    }
    return true;
  });
}

function renderList() {
  const area = document.getElementById('list-area');
  const filtered = getFiltered();
  if (!filtered.length) { area.innerHTML = '<div class="empty"><i class="ti ti-search-off" style="font-size:28px;display:block;margin-bottom:8px"></i>Sin resultados para esta búsqueda</div>'; return; }
  area.innerHTML = filtered.map(it => {
    const s = state[it.id];
    const cls = s.check === 'presente' ? 'presente' : s.check === 'ausente' ? 'ausente' : s.check === 'pendiente' ? 'pendiente' : '';
    const ico = getIcon(it.clase);
    const thumbContent = s.photo ? `<img src="${s.photo}" alt="foto">` : `<i class="ti ${ico}" aria-hidden="true"></i><span class="cam-ico"><i class="ti ti-camera-plus" aria-hidden="true"></i></span>`;
    return `<div class="item-card ${cls}" id="card-${it.id.replace(/[^a-z0-9]/gi,'_')}">
      <div class="item-thumb" onclick="openModal('${it.id}')" title="Añadir foto">${thumbContent}</div>
      <div class="item-info">
        <div class="item-clase">${it.clase}</div>
        <div class="item-nombre">${it.marca} ${it.modelo}</div>
        <div class="item-serie">Serie: ${it.serie} · Inv: ${it.nroInventario}</div>
      </div>
      <div class="item-comment-wrap">
        <textarea placeholder="Observación…" oninput="setComment('${it.id}',this.value)">${s.comment}</textarea>
      </div>
      <div class="check-btns">
        <button class="chk chk-si ${s.check==='presente'?'active':''}" onclick="setCheck('${it.id}','presente')"><i class="ti ti-check" aria-hidden="true"></i> Presente</button>
        <button class="chk chk-no ${s.check==='ausente'?'active':''}" onclick="setCheck('${it.id}','ausente')"><i class="ti ti-x" aria-hidden="true"></i> Ausente</button>
        <button class="chk chk-na ${s.check==='pendiente'?'active':''}" onclick="setCheck('${it.id}','pendiente')"><i class="ti ti-alert-triangle" aria-hidden="true"></i> Novedad</button>
      </div>
    </div>`;
  }).join('');
}

function setCheck(id, val) {
  state[id].check = state[id].check === val ? null : val;
  renderList(); updateStats();
}
function setComment(id, val) { state[id].comment = val; }

function openModal(id) {
  modalItemId = id;
  const s = state[id];
  const prev = document.getElementById('modal-preview');
  prev.innerHTML = s.photo ? `<img src="${s.photo}" alt="foto">` : 'Sin foto asignada';
  const it = ITEMS.find(x => x.id === id);
  document.querySelector('.modal h3').textContent = it ? it.marca + ' ' + it.modelo : 'Foto';
  document.getElementById('photo-modal').classList.add('open');
}
function closeModal() {
  document.getElementById('photo-modal').classList.remove('open');
  modalItemId = null;
}
document.getElementById('photo-modal').addEventListener('click', function(e) { if(e.target===this) closeModal(); });
document.getElementById('file-input').addEventListener('change', function() {
  if (!this.files[0] || !modalItemId) return;
  const reader = new FileReader();
  reader.onload = e => {
    state[modalItemId].photo = e.target.result;
    document.getElementById('modal-preview').innerHTML = `<img src="${e.target.result}" alt="foto">`;
    renderList();
  };
  reader.readAsDataURL(this.files[0]);
  this.value = '';
});

document.getElementById('search').addEventListener('input', function() { searchQ = this.value; renderList(); });
document.getElementById('cat-filter').addEventListener('change', function() { catFilter = this.value; renderList(); });
document.querySelectorAll('.fbtn').forEach(btn => {
  btn.addEventListener('click', function() {
    document.querySelectorAll('.fbtn').forEach(b => b.classList.remove('active'));
    this.classList.add('active');
    activeFilter = this.dataset.f;
    renderList();
  });
});

function exportPDF() {
  const pres = ITEMS.filter(it => state[it.id].check === 'presente').length;
  const aus = ITEMS.filter(it => state[it.id].check === 'ausente').length;
  const pend = ITEMS.filter(it => state[it.id].check === null).length;
  const nov = ITEMS.filter(it => state[it.id].check === 'pendiente').length;
  const fecha = new Date().toLocaleDateString('es-CO', {year:'numeric',month:'long',day:'numeric'});
  
  let rows = ITEMS.map((it,i) => {
    const s = state[it.id];
    const est = s.check === 'presente' ? '✓ PRESENTE' : s.check === 'ausente' ? '✗ AUSENTE' : s.check === 'pendiente' ? '⚠ NOVEDAD' : '— SIN REVISAR';
    const color = s.check === 'presente' ? '#1a6b3a' : s.check === 'ausente' ? '#8b1a1a' : s.check === 'pendiente' ? '#7a5a00' : '#555';
    const photoCell = s.photo ? `<td style="padding:5px 8px;text-align:center;"><img src="${s.photo}" style="width:50px;height:40px;object-fit:cover;border-radius:4px;border:0.5px solid #ddd;"></td>` : `<td style="padding:5px 8px;text-align:center;color:#aaa;font-size:11px;">—</td>`;
    return `<tr style="background:${i%2===0?'#fff':'#f8f8f8'}">
      <td style="padding:5px 8px;font-size:11px;color:#888">${i+1}</td>
      <td style="padding:5px 8px;font-size:11px;font-weight:500">${it.clase}</td>
      <td style="padding:5px 8px;font-size:11px">${it.marca} ${it.modelo}</td>
      <td style="padding:5px 8px;font-size:10px;font-family:monospace;color:#555">${it.serie}</td>
      <td style="padding:5px 8px;font-size:11px;font-weight:600;color:${color}">${est}</td>
      ${photoCell}
      <td style="padding:5px 8px;font-size:11px;color:#555">${s.comment || '—'}</td>
    </tr>`;
  }).join('');

  const html = `<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Revista de Inventario — Medios Audiovisuales</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 0; color: #111; }
    .header { background: #0a0a0a; color: #fff; padding: 28px 32px 22px; }
    .header h1 { font-size: 22px; font-weight: 700; margin: 0 0 4px; letter-spacing: 0.05em; }
    .header p { font-size: 13px; color: rgba(255,255,255,0.6); margin: 0; }
    .summary { display: flex; gap: 0; border-bottom: 1px solid #e8e8e8; }
    .sum-box { flex: 1; padding: 18px 20px; text-align: center; border-right: 1px solid #e8e8e8; }
    .sum-box:last-child { border-right: none; }
    .sum-num { font-size: 28px; font-weight: 700; }
    .sum-lbl { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: #888; margin-top: 2px; }
    .section-title { padding: 16px 24px 8px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: #888; border-bottom: 0.5px solid #eee; }
    table { width: 100%; border-collapse: collapse; }
    th { background: #f0f0f0; padding: 7px 8px; font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: #555; text-align: left; }
    .footer { text-align: center; padding: 20px; font-size: 11px; color: #aaa; border-top: 1px solid #eee; margin-top: 20px; }
    @media print { body { -webkit-print-color-adjust: exact; print-color-adjust: exact; } }
  </style></head><body>
  <div class="header">
    <h1>&#9632; REVISTA DE INVENTARIO</h1>
    <p>Grupo Medios Audiovisuales · COEST · Generado el ${fecha}</p>
  </div>
  <div class="summary">
    <div class="sum-box"><div class="sum-num">${ITEMS.length}</div><div class="sum-lbl">Total equipos</div></div>
    <div class="sum-box"><div class="sum-num" style="color:#1a6b3a">${pres}</div><div class="sum-lbl">Presentes</div></div>
    <div class="sum-box"><div class="sum-num" style="color:#8b1a1a">${aus}</div><div class="sum-lbl">Ausentes</div></div>
    <div class="sum-box"><div class="sum-num" style="color:#7a5a00">${nov}</div><div class="sum-lbl">Con novedad</div></div>
    <div class="sum-box"><div class="sum-num" style="color:#aaa">${pend}</div><div class="sum-lbl">Sin revisar</div></div>
  </div>
  <div class="section-title">Detalle del inventario</div>
  <table><thead><tr><th>#</th><th>Clase</th><th>Marca / Modelo</th><th>Serie</th><th>Estado</th><th>Foto</th><th>Observaciones</th></tr></thead><tbody>${rows}</tbody></table>
  <div class="footer">Documento generado automáticamente · Grupo Medios Audiovisuales · COEST</div>
  </body></html>`;
  
  const blob = new Blob([html], {type:'text/html'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'revista_inventario_medios_' + new Date().toISOString().slice(0,10) + '.html';
  a.click(); URL.revokeObjectURL(url);
}

const cats = [...new Set(ITEMS.map(it => it.clase))].sort();
const sel = document.getElementById('cat-filter');
cats.forEach(c => { const o = document.createElement('option'); o.value = c; o.textContent = c; sel.appendChild(o); });

document.getElementById('fecha-rev').textContent = new Date().toLocaleDateString('es-CO', {year:'numeric',month:'long',day:'numeric'});

renderList();
updateStats();
</script>
